[project]
name = "flight-search-backend"
version = "0.1.0"
description = "Value-ranked flight search: planner, scoring and streaming agent"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "matplotlib>=3.11.2",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
]

[project.optional-dependencies]
fli = [
    "flights>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# Acceptance tests run only by explicit path (see features.json and the Stop hook).
norecursedirs = ["acceptance"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # long prompt strings; FastAPI Depends idiom
