[project]
name = "flight-search-backend"
version = "0.1.0"
description = "Value-ranked flight search: planner, scoring and streaming agent"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
]

[project.optional-dependencies]
fli = [
    "flights>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
